name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: git ls-files '*.mjs' | xargs -n1 node --check
      - name: Check Python tooling
        run: python3 -m py_compile scripts/*.py
      # The HTML deliverables are generated from src/; a stale commit fails here.
      - name: Check generated HTML is up to date
        run: |
          npm run build
          git diff --exit-code -- index.html custom-garment.html agentic.html
